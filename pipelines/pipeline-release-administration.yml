trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - examples
      - '*.md'

resources:
  repositories:
  - repository: Framework.Templates
    type: git
    name: Framework.Templates
    ref: main
pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Tag_Release
  jobs:
  - template: azuredevops/templates/jobs/commit-tagging.yml@Framework.Templates
